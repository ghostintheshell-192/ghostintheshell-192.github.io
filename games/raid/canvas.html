<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- The RAID Sandbox moved to its own site. This page only exists so the old
       indexed URL keeps working and hands its history to the new one: canonical
       tells search engines where the content lives now, the refresh moves people.
       GitHub Pages cannot serve a real 301, which is what this stands in for. -->
  <title>RAID Sandbox has moved</title>
  <link rel="canonical" href="https://raid-sandbox.dev/">
  <meta http-equiv="refresh" content="0; url=https://raid-sandbox.dev/">
  <meta name="robots" content="noindex, follow">
</head>
<body>
  <p>The RAID Sandbox now lives at <a href="https://raid-sandbox.dev/">raid-sandbox.dev</a>.</p>
</body>
</html>
